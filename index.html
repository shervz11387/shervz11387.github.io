<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minimal Image Display — Download</title>
  <style>
    :root{
      --bg1:#f7f8fc;
      --bg2:#eef2ff;
      --card:#ffffff;
      --muted:#6b7280;
      --accent:#6c63ff;
      --accent2:#8f7bff;
      --glass: rgba(255,255,255,0.6);
      --shadow: 0 8px 30px rgba(20,24,40,0.08);
      --radius:18px;
      --maxw:900px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      color:#0f172a;
    }

    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.9), var(--card));
      border-radius:var(--radius);
      padding:28px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(6px) saturate(120%);
      border: 1px solid rgba(99,102,241,0.06);
      max-width:var(--maxw);
      width:100%;
    }

    .hero{
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .image-frame{
      margin-top:8px;
      background: linear-gradient(135deg,#ffffff,#fbfbff);
      border-radius:14px;
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:420px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 6px 22px rgba(15,23,42,0.04);
      overflow:hidden;
    }

    img#photo{
      max-width:100%;
      max-height:100%;
      border-radius:10px;
      object-fit:contain;
      display:block;
      box-shadow: 0 6px 20px rgba(12,18,34,0.06);
    }

    .meta{
      font-size:13px;color:var(--muted);margin-top:6px;text-align:center
    }

    .download-bar{
      position:fixed;left:50%;transform:translateX(-50%);
      bottom:22px;background:var(--glass);border-radius:999px;padding:10px 18px;box-shadow:0 12px 30px rgba(9,10,22,0.12);backdrop-filter: blur(8px);
      display:flex;gap:12px;align-items:center;border:1px solid rgba(15,23,42,0.04)
    }

    .download-bar small{color:var(--muted);font-size:13px}

    .btn{
      appearance:none;
      border:0;
      padding:10px 16px;
      border-radius:999px;
      font-weight:600;
      cursor:pointer;
      background:linear-gradient(90deg,var(--accent), var(--accent2));
      color:white;
      box-shadow: 0 6px 18px rgba(108,99,255,0.25);
      transition: all 0.25s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(108,99,255,0.35);
    }

    .btn.secondary{
      background:transparent;
      color:var(--accent);
      border:2px solid var(--accent);
      box-shadow:none;
    }

    .btn.secondary:hover{
      background:var(--accent);
      color:white;
    }

    @media (max-width:880px){
      .download-bar{left:14px;transform:none;width:calc(100% - 28px);justify-content:space-between;flex-wrap:wrap}
      .image-frame{min-height:320px}
    }
  </style>
</head>
<body>
  <div class="card hero">
    <div class="image-frame" id="frame">
      <img id="photo" src="img/preview.jpg" alt="Preview Image"/>
    </div>

    <div class="meta">Displayed image: <strong>Preview.jpg</strong></div>
  </div>

  <div class="download-bar" role="region" aria-label="download bar">
    <div style="display:flex;flex-direction:column">
      <small id="filename">Preview.jpg</small>
      <small style="font-weight:600">Ready to download</small>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn" id="downloadFixed">Download Image</button>
      <button class="btn secondary" id="openNew">Open in New Tab</button>
    </div>
  </div>

  <script>
    const photo = document.getElementById('photo');
    const downloadFixed = document.getElementById('downloadFixed');
    const openNew = document.getElementById('openNew');

    async function downloadImage(imgSrc, name){
      if(!imgSrc) return;
      try{
        const resp = await fetch(imgSrc);
        if(!resp.ok) throw new Error('failed to fetch');
        const blob = await resp.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = name || 'image';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(blobUrl);
      }catch(err){
        console.warn('download fallback', err);
        const a = document.createElement('a');
        a.href = imgSrc;
        a.target = '_blank';
        a.rel = 'noopener';
        a.click();
      }
    }

    downloadFixed.addEventListener('click', ()=>downloadImage(photo.src, 'preview.jpg'));

    openNew.addEventListener('click', ()=>{
      window.open(photo.src, '_blank', 'noopener');
    });
  </script>
</body>
  </html>
